name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure CMake
        run: cmake --preset windows-x64-vst3-release
      - name: Build
        run: cmake --build --preset windows-x64-vst3-release-build
      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v7
        with:
          name: phu-fair-kid-67-plugin
          path: build/src/phu-fair-kid-67_artefacts/Release/VST3
      - name: Validate Plugin
        uses: ./.github/workflows/validate-plugin.yml
        with:
          plugin-path: build/src/phu-fair-kid-67_artefacts/Release/VST3

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Dependencies
        run: sudo bash scripts/install-linux-deps.sh
      - name: Configure CMake
        run: cmake --preset linux-x64-vst3-release
      - name: Build
        run: cmake --build --preset linux-x64-vst3-release-build

  build-macos-intel:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure CMake (x86_64)
        run: cmake --preset macos-x64-vst3-release
      - name: Build (x86_64)
        run: cmake --build --preset macos-x64-vst3-release-build

  build-macos-arm64:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure CMake (arm64)
        run: cmake --preset macos-arm64-vst3-release
      - name: Build (arm64)
        run: cmake --build --preset macos-arm64-vst3-release-build
